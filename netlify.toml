[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Claude proxy and key status for the hosted site (the Vite dev server handles these locally).
[[edge_functions]]
  path = "/api/anthropic/*"
  function = "anthropic"

[[edge_functions]]
  path = "/api/ai-status"
  function = "anthropic"
