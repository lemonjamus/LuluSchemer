appId: com.luluschemer.app
productName: LuluSchemer
directories:
  # Plain relative path so CI runners work. Building here locally can fail with EPERM
  # because OneDrive locks files mid-sync; build elsewhere with
  #   npx electron-builder --win --config.directories.output=%LOCALAPPDATA%/luluschemer-release
  output: release
  buildResources: build
files:
  - out/**
  - package.json
publish:
  provider: github
  owner: lemonjamus
  repo: LuluSchemer
  # Default is "draft", and drafts are invisible to the updater — publish straight away.
  releaseType: release
  # Public repo: installers download straight from the release, no token in the app.
  private: false

win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

# macOS needs a build on a Mac (or a macOS CI runner) and build/icon.icns.
# Without an Apple Developer certificate the app still runs, but updates are
# download-and-drag rather than silent — see README.
mac:
  # Without an explicit arch list the runner only builds its own (arm64), leaving
  # Intel Macs with nothing. Two .dmgs (~130 MB each) beat one universal ~260 MB file,
  # and the updater picks the right one per machine.
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png # electron-builder converts it to .icns during a macOS build
  category: public.app-category.productivity
  # Apple Silicon refuses to launch a binary with no signature at all, and reports it as
  # "damaged". Ad-hoc signing ("-") costs nothing and no Apple account, and fixes that.
  # It is not a Developer ID: Gatekeeper still warns on first launch (right-click → Open),
  # and updates stay download-and-drag.
  identity: '-'
  # Hardened runtime defaults to true and, with an ad-hoc signature, rejects Electron's
  # pre-signed frameworks (different Team ID) — the app would fail to start.
  hardenedRuntime: false
