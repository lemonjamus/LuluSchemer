appId: com.luluschemer.app
productName: LuluSchemer
directories:
  # Outside OneDrive: it locks files mid-sync and packaging fails with EPERM on rename.
  output: ${env.LOCALAPPDATA}/luluschemer-release
  buildResources: build
files:
  - out/**
  - package.json
publish:
  provider: github
  owner: lemonjamus
  repo: LuluSchemer
  # Default is "draft", and drafts are invisible to the updater — publish straight away.
  releaseType: release
  # Private repo: assets are only downloadable through the API, and the app needs a
  # GH_TOKEN to do it. Set this to false once the repo is public (then no token is needed).
  private: true

win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

# macOS needs a build on a Mac (or a macOS CI runner) and build/icon.icns.
# Without an Apple Developer certificate the app still runs, but updates are
# download-and-drag rather than silent — see README.
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
